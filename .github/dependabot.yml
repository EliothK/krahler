version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Held back until the toolchain supports them: the build runs on Node 24, and the Babel and TypeScript majors break the React compiler plugin and the build.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly }
    ignore:
      # The Java version lives in four places that must move together: pom.xml (java.version), both Dockerfile stages, and setup-java in api.yml.
      # Dependabot bumped only the build stage once (#33: JDK 26 compiling for a Java 25 runtime), so Java upgrades are made by hand, all at once.
      # The maven tag (3-eclipse-temurin-25) already floats to the newest Maven 3 on every build, so nothing is lost by ignoring it.
      - dependency-name: "library/maven"
      - dependency-name: "library/eclipse-temurin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /lab # the AKS lab image
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "node" # stay on the LTS line
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directory: /terraform # production site
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /api/terraform # the API's Container App
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /lab/terraform # AKS lab
    schedule: { interval: weekly }
    ignore:
      # The lab is torn down; provider majors change syntax and can't be tested without rebuilding it.
      - dependency-name: "hashicorp/helm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hashicorp/kubernetes"
        update-types: ["version-update:semver-major"]
