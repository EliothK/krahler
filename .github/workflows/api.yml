name: api

# Tests the Spring Boot API, publishes its container image to ghcr.io, and rolls it out to the Container App behind api.krahler.com.
# Only runs when the API changes, so it is not a required status check on main.

on:
    push:
        branches: [main]
        paths: ["api/**", ".github/workflows/api.yml"]
    pull_request:
        paths: ["api/**", ".github/workflows/api.yml"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: api-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: api
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven

            - name: Unit and integration tests
              run: mvn -B verify

            - name: Build the container image
              run: docker build -t krahler-api:ci .

    # Publishes the image the Container App runs, to GitHub's registry (free for a public repo, so no Azure registry is needed).
    # The label links the package to this repo. The package must be public so Azure can pull it without a credential.
    publish:
        needs: test
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

            - name: Log in to ghcr.io
              run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            - name: Build and push
              run: |
                  image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/krahler-api"
                  docker build \
                    --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
                    --label "org.opencontainers.image.revision=${{ github.sha }}" \
                    -t "$image:${{ github.sha }}" -t "$image:latest" api
                  docker push "$image:${{ github.sha }}"
                  docker push "$image:latest"

    # Rolls the new image out to the Container App, then proves the live API is running this commit.
    # Uses the same OIDC login as the site: no stored Azure credential.
    deploy:
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: production
        permissions:
            id-token: write
            contents: read
        env:
            RESOURCE_GROUP: rg-portfolio-api # names, not secrets; they match api/terraform
            APP_NAME: ca-portfolio-api
            API_URL: https://api.krahler.com
            DB_HOST: sql-portfolio-api.database.windows.net
            DB_NAME: sqldb-portfolio-contacts
            # No database password: the API signs in as the Container App's managed identity (database user [ca-portfolio-api]); SQL authentication is off.
            # CORS. Set on every deploy because api/terraform ignores env changes after creation, so this is the only place the live list can change.
            # The third origin is the site's `staging` preview environment (deploy.yml), so the contact form, status panel and activity feed work there too.
            ALLOWED_ORIGINS: https://krahler.com,https://www.krahler.com,https://orange-river-067e6cd10-staging.centralus.6.azurestaticapps.net
        steps:
            - name: Authenticate to Azure
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v2.0.0
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            # The Gmail app password the contact form emails through.
            # Set as a Container App secret rather than a plain env var so it never appears in `az containerapp show` output, and refreshed every deploy so rotating it in GitHub takes effect on the next merge without a manual Azure step.
            # The deploy check token only lets this workflow ask the API to prove it can reach the database (see the last step).
            - name: Set the mail, GitHub activity and deploy check secrets
              env:
                  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
                  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
                  GITHUB_ACTIVITY_TOKEN: ${{ secrets.GH_ACTIVITY_TOKEN }}
                  DEPLOY_CHECK_TOKEN: ${{ secrets.DEPLOY_CHECK_TOKEN }}
              run: |
                  az containerapp secret set \
                    --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
                    --secrets "mail-username=$MAIL_USERNAME" "mail-password=$MAIL_PASSWORD" "github-activity-token=$GITHUB_ACTIVITY_TOKEN" "deploy-check-token=$DEPLOY_CHECK_TOKEN"

            # A new revision starts alongside the old one, and traffic moves once it passes its readiness probe.
            #
            # DEPLOY_RUN_ID exists only to force that new revision on every run, including a workflow_dispatch rerun of the same commit (e.g. to rotate MAIL_PASSWORD).
            # Without something that always changes, Azure compares this spec to the running one, sees identical text (the image tag, the "secretref:..." references) and skips the restart — so the container keeps running on whatever secret VALUES it started with, silently ignoring a rotated secret.
            # Found the hard way: rotating MAIL_PASSWORD and redeploying repeatedly had no effect until a change here finally forced a real restart.
            - name: Roll out the image
              run: |
                  az containerapp update \
                    --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
                    --image "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/krahler-api:${{ github.sha }}" \
                    --set-env-vars \
                      "API_VERSION=${{ github.sha }}" \
                      "API_ALLOWED_ORIGINS=$ALLOWED_ORIGINS" \
                      "DEPLOY_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}" \
                      "MAIL_USERNAME=secretref:mail-username" \
                      "MAIL_PASSWORD=secretref:mail-password" \
                      "DB_HOST=$DB_HOST" \
                      "DB_NAME=$DB_NAME" \
                      "DB_AUTHENTICATION=ActiveDirectoryManagedIdentity" \
                      "GITHUB_ACTIVITY_TOKEN=secretref:github-activity-token" \
                      "DEPLOY_CHECK_TOKEN=secretref:deploy-check-token" \
                    --remove-env-vars DB_USERNAME DB_PASSWORD

            # /api/status reports the version it was started with, so this fails if the old revision is still serving.
            # The first call can take a while: the app may scale up from zero and start a JVM.
            - name: Wait for the new version to answer
              run: |
                  for i in $(seq 1 18); do
                    version=$(curl -sf -m 30 "$API_URL/api/status" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
                    echo "attempt $i: version=${version:-none}"
                    [ "$version" = "${{ github.sha }}" ] && exit 0
                    sleep 10
                  done
                  echo "the API never reported ${{ github.sha }}" >&2
                  exit 1

            # A version that answers /api/status has NOT necessarily reached the database: nothing connects at startup, so Azure SQL can auto-pause while the uptime check keeps cold-starting the API.
            # This asks the new version to run the migration and a query, so a broken database login fails the deploy rather than a visitor's message.
            # It wakes the database once per deploy; the first request can take a while if the database was paused.
            - name: Check the new version can reach the database
              env:
                  DEPLOY_CHECK_TOKEN: ${{ secrets.DEPLOY_CHECK_TOKEN }}
              run: |
                  for i in $(seq 1 6); do
                    code=$(curl -s -m 90 -o /dev/null -w '%{http_code}' -X POST -H "X-Deploy-Check-Token: $DEPLOY_CHECK_TOKEN" "$API_URL/api/deploy-check")
                    echo "attempt $i: HTTP $code"
                    [ "$code" = 200 ] && exit 0
                    sleep 15
                  done
                  echo "the new version could not reach the database" >&2
                  exit 1

            # Left over from password sign-in. Only removed once the new version, which doesn't reference it, is serving; a no-op on later runs.
            - name: Remove the old database password secret
              run: |
                  if az containerapp secret list --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query "[?name=='db-password'] | length(@)" -o tsv | grep -qx 1; then
                    az containerapp secret remove --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --secret-names db-password -o none
                    echo "Removed the db-password secret"
                  fi
