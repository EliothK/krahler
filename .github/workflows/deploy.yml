name: deploy

# Production pipeline for krahler.com (Azure Static Web Apps).
#   pull_request        ci + terraform checks, then deploy to the `staging` preview environment and run the smoke and browser checks there; production is untouched
#   push to main        ci + terraform checks, then deploy, then smoke test and Lighthouse against the live site
#   workflow_dispatch   redeploy without a new commit
#
# The AKS lab has its own manual-only pipeline: lab-deploy.yml. Nothing here can start or touch the cluster.
#
# The required status checks on main are named `ci` and `terraform`. Keep those two job names.

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

# Default for every job. The deploy job widens this for itself.
permissions:
    contents: read

# A second push while the first is deploying would race. Queue instead.
concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

env:
    VITE_GITHUB_USER: ${{ vars.VITE_GITHUB_USER }}
    VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  cache: "npm"

            # The lab is only deployed by hand, so nothing else would notice if its manifests stopped applying in a working order.
            # A first deploy to a fresh cluster fails unless every Namespace is created before anything placed in it.
            - name: Lab manifests apply Namespaces first
              run: |
                  kinds=$(kubectl kustomize lab/k8s | awk '/^kind:/ {print $2}')
                  echo "$kinds" | tr '\n' ' '; echo
                  last_ns=$(echo "$kinds" | grep -n '^Namespace$' | tail -1 | cut -d: -f1)
                  first_other=$(echo "$kinds" | grep -vn '^Namespace$' | head -1 | cut -d: -f1)
                  [ -n "$last_ns" ] && [ "$last_ns" -lt "$first_other" ]

            - run: npm ci
            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high
            - run: npm run lint
            - run: npm test
            - run: npm run build
              env:
                  GITHUB_TOKEN: ${{ github.token }} # lifts the rate limit for the build-time activity snapshot

            # The deploy job ships exactly this build, so what is deployed is what was tested.
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: site-dist
                  path: dist
                  if-no-files-found: error
                  retention-days: 7

    # The site and the AKS lab are separate Terraform roots with separate state, so each is checked on its own.
    terraform-validate:
        name: terraform-validate (${{ matrix.name }})
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { name: site, dir: terraform, key: site.tfstate }
                    - { name: api, dir: api/terraform, key: api.tfstate }
                    - {
                          name: lab,
                          dir: lab/terraform,
                          key: "${{ vars.TFSTATE_KEY }}",
                      }
        defaults:
            run:
                working-directory: ${{ matrix.dir }} # applies to every run step below
        permissions:
            # Dependabot PRs never get secrets, even same-repo ones, so the real backend init below only runs on push (post-merge to main).
            id-token: write # the backend talks to Azure
            contents: read
        env:
            ARM_USE_OIDC: true
            ARM_CLIENT_ID: ${{secrets.AZURE_CLIENT_ID}}
            ARM_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
            ARM_SUBSCRIPTION_ID: ${{secrets.AZURE_SUBSCRIPTION_ID}}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v3.0.0
              with:
                  terraform_version: 1.15.x # matches the version that wrote the state (see infrastructure.yml)

            - run: terraform fmt -check -recursive

            - name: terraform init (real backend, push only)
              if: github.event_name == 'push'
              run: |
                  terraform init \
                    -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
                    -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
                    -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
                    -backend-config="key=${{ matrix.key }}"

            - name: terraform init (no backend, PR checks, no secrets available)
              if: github.event_name != 'push'
              run: terraform init -backend=false

            - run: terraform validate

    # One stable check name for branch protection. The matrix job above has per-root names, which a required check cannot follow.
    terraform:
        needs: terraform-validate
        if: ${{ always() }}
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - name: All Terraform roots validated
              run: |
                  echo "terraform-validate: ${{ needs.terraform-validate.result }}"
                  [ "${{ needs.terraform-validate.result }}" = "success" ]

    # Staging: every PR deploys the exact build ci tested to a fixed `staging` preview environment of the same Static Web App, then runs the live-site checks against it, so a broken build shows up before merge rather than after the production deploy.
    # One fixed environment rather than one per PR: every PR comes from dev, so staging is always "what's about to ship", and there is nothing to clean up.
    # Skipped for Dependabot and fork PRs, which get no secrets. Lighthouse stays on production only; preview scores are noisier.
    staging:
        needs: [ci]
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: staging
            url: ${{ steps.site.outputs.url }}
        # Two PRs updating staging at once would race, and the checks could end up testing the other PR's build.
        concurrency:
            group: staging
            cancel-in-progress: false
        permissions:
            id-token: write # OIDC; the federated credential trusts environment:staging, not this branch
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  cache: "npm"

            - run: npm ci

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: site-dist
                  path: dist

            - name: Authenticate to Azure
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v2.0.0
              with:
                  client-id: ${{secrets.AZURE_CLIENT_ID}}
                  tenant-id: ${{secrets.AZURE_TENANT_ID}}
                  subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}

            - name: Get deployment token
              id: token
              run: |
                  token=$(az staticwebapp secrets list \
                    --name "${{ vars.SWA_NAME }}" \
                    --resource-group "${{ vars.SWA_RESOURCE_GROUP }}" \
                    --query properties.apiKey -o tsv)
                  echo "::add-mask::$token"
                  echo "token=$token" >> "$GITHUB_OUTPUT"

            - name: Deploy to the staging environment
              env:
                  SWA_CLI_DEPLOYMENT_TOKEN: ${{ steps.token.outputs.token }}
              run: npx --yes @azure/static-web-apps-cli@2.0.10 deploy ./dist --env staging

            - name: Find the staging URL
              id: site
              run: |
                  host=$(az staticwebapp environment list \
                    --name "${{ vars.SWA_NAME }}" \
                    --resource-group "${{ vars.SWA_RESOURCE_GROUP }}" \
                    --query "[?contains(hostname, '-staging.')].hostname | [0]" -o tsv)
                  [ -n "$host" ] || { echo "No staging environment found"; exit 1; }
                  echo "url=https://$host" >> "$GITHUB_OUTPUT"
                  echo "Staging: https://$host" >> "$GITHUB_STEP_SUMMARY"

            - name: Wait for staging to answer
              run: curl -sf --retry 10 --retry-delay 5 --retry-all-errors -o /dev/null "${{ steps.site.outputs.url }}/"

            - name: Smoke test staging
              env:
                  SMOKE_URL: ${{ steps.site.outputs.url }}
              run: npm run smoke || { sleep 45; npm run smoke; }

            - name: Browser checks on staging
              env:
                  SMOKE_URL: ${{ steps.site.outputs.url }}
              run: npm run browser

    deploy:
        needs: [ci, terraform]
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: production
        permissions:
            id-token: write # required for OIDC. Omit it and auth fails opaquely
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  cache: "npm"

            # Needed to run the smoke and Lighthouse checks after the deploy.
            - run: npm ci

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: site-dist
                  path: dist

            - name: Authenticate to Azure
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v2.0.0
              with:
                  client-id: ${{secrets.AZURE_CLIENT_ID}}
                  tenant-id: ${{secrets.AZURE_TENANT_ID}}
                  subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}

            # No long-lived deployment token in GitHub: read it from Azure with the OIDC login, at run time.
            - name: Get deployment token
              id: token
              run: |
                  token=$(az staticwebapp secrets list \
                    --name "${{ vars.SWA_NAME }}" \
                    --resource-group "${{ vars.SWA_RESOURCE_GROUP }}" \
                    --query properties.apiKey -o tsv)
                  echo "::add-mask::$token"
                  echo "token=$token" >> "$GITHUB_OUTPUT"

            # dist/ already contains staticwebapp.config.json (copied from public/ by Vite).
            - name: Deploy to Static Web Apps
              env:
                  SWA_CLI_DEPLOYMENT_TOKEN: ${{ steps.token.outputs.token }}
              run: npx --yes @azure/static-web-apps-cli@2.0.10 deploy ./dist --env production

            - name: Find the deployed URL
              id: site
              run: |
                  host=$(az staticwebapp show \
                    --name "${{ vars.SWA_NAME }}" \
                    --resource-group "${{ vars.SWA_RESOURCE_GROUP }}" \
                    --query defaultHostname -o tsv)
                  echo "url=https://$host" >> "$GITHUB_OUTPUT"

            # A fresh deploy can take a few seconds to reach every edge, so wait for the origin directly rather than failing the checks on a race.
            - name: Wait for the new version to answer
              run: curl -sf --retry 10 --retry-delay 5 --retry-all-errors -o /dev/null "${{ steps.site.outputs.url }}/"

            # From here on, test the hostname visitors actually use, not the *.azurestaticapps.net one from the step above.
            # the API's CORS only allows krahler.com and www.krahler.com, so a check against the default hostname would fail on the contact form and the status ping, even though the site itself is fine.
            - name: Smoke test the live site
              env:
                  SMOKE_URL: https://krahler.com
              # The CDN can serve the previous version for a few seconds after the deploy finishes, so retry once before failing.
              run: npm run smoke || { sleep 45; npm run smoke; }

            - name: Browser checks
              env:
                  SMOKE_URL: https://krahler.com
              run: npm run browser

            - name: Lighthouse thresholds
              env:
                  SMOKE_URL: https://krahler.com
              run: npm run lighthouse

            - name: Report what shipped
              run: |
                  echo "### Deployed \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "https://krahler.com" >> "$GITHUB_STEP_SUMMARY"
