name: deploy

on:
    push:
        branches: [main]
    pull_request:

# Default for every job. The deploy job widens this for itself.

permissions:
    contents: read

# A second push while the first is deploying would race. Queue instead.
concurrency:
    group: deploy-${{github.ref}}
    cancel-in-progress: false

env:
    REGISTRY: ${{ vars.REGISTRY }}
    IMAGE_NAME: portfolio
    RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
    CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
    DEPLOYMENT: ${{ vars.DEPLOYMENT }}

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  cache: "npm"

            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run build

            # Proves the image builds on every PR. Doesn't push.
            - name: Build container image
              run: docker build -t "$IMAGE_NAME:${{github.sha}}" .

    terraform:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: terraform # applies to every run step below
        permissions:
            # Dependabot PRs never get secrets, even same-repo ones, so the real backend init below only runs on push (post-merge to main).
            id-token: write # the backend now talks to Azure
            contents: read
        env:
            ARM_USE_OIDC: true
            ARM_CLIENT_ID: ${{secrets.AZURE_CLIENT_ID}}
            ARM_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
            ARM_SUBSCRIPTION_ID: ${{secrets.AZURE_SUBSCRIPTION_ID}}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v3.0.0
              with:
                  terraform_version: 1.9.x

            - run: terraform fmt -check -recursive

            - name: terraform init (real backend, push only)
              if: github.event_name == 'push'
              run: |
                  terraform init \
                    -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
                    -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
                    -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
                    -backend-config="key=${{ vars.TFSTATE_KEY }}"

            - name: terraform init (no backend, PR checks — no secrets available)
              if: github.event_name != 'push'
              run: terraform init -backend=false

            - run: terraform validate

    deploy:
        needs: [ci, terraform]
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: production
        permissions:
            id-token: write # required for OIDC. Omit it and auth fails opaquely
            contents: read
            attestations: write # required to publish build provenance
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

            - name: Authenticate to Azure
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v2.0.0
              with:
                  client-id: ${{secrets.AZURE_CLIENT_ID}}
                  tenant-id: ${{secrets.AZURE_TENANT_ID}}
                  subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}

            - name: Log in to the registry
              run: az acr login --name "${REGISTRY%%.*}"

            - name: Build image
              run: docker build -t "$REGISTRY/$IMAGE_NAME:${{github.sha}}" .

            - name: Scan image for vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  severity: HIGH,CRITICAL
                  exit-code: "1"
                  ignore-unfixed: true

            - name: Push image
              id: push
              run: |
                  IMAGE="$REGISTRY/$IMAGE_NAME:${{github.sha}}"
                  docker push "$IMAGE"
                  DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
                  echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  subject-digest: ${{ steps.push.outputs.digest }}
                  push-to-registry: true

            - name: Get cluster credentials
              run: |
                  az aks get-credentials \
                    --resource-group "$RESOURCE_GROUP" \
                    --name "$CLUSTER_NAME" \
                    --overwrite-existing

            - name: Apply manifests
              run: kubectl apply -f k8s/

            - name: Set the image to this commit
              run: |
                  kubectl set image "deployment/$DEPLOYMENT" \
                    "$DEPLOYMENT=$REGISTRY/$IMAGE_NAME:${{github.sha}}" -n portfolio

            - name: Verify the rollout actually succeeded
              run: kubectl rollout status "deployment/$DEPLOYMENT" -n portfolio --timeout=120s

            - name: Report what shipped
              run: |
                  echo "### Deployed \`${{github.sha}}\`" >> "$GITHUB_STEP_SUMMARY"
                  kubectl get pods -n portfolio -l app=portfolio -o wide >> "$GITHUB_STEP_SUMMARY"
