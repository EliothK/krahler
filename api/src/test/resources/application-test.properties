# Tests run against in-memory H2, not Azure SQL: no network, no cost, no state carried between runs.
# Flyway still runs the real migration (MSSQLServer compatibility mode accepts its T-SQL) and Hibernate still only validates, same as production — after the first deploy silently skipped Flyway entirely with no error, having a test that
# would have caught it seemed worth more than a from-scratch schema and a comment promising the two match.
spring.datasource.url=jdbc:h2:mem:contacts;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.mail.host=localhost
