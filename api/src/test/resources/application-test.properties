# Tests run against in-memory H2, not Azure SQL: no network, no cost, no state carried between runs.
# Flyway still runs the real migration (MSSQLServer compatibility mode accepts its T-SQL) rather than Hibernate building the schema — after the first deploy silently skipped Flyway entirely with no error, having tests that
# run against the migrated schema seemed worth more than a from-scratch schema and a comment promising the two match.
spring.datasource.url=jdbc:h2:mem:contacts;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=
# Same lazy setup as production (see application.properties): the schema appears on the first contact submission, or when a test calls LazySchemaMigrator.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.mail.host=localhost
