# Tests run against in-memory H2, not Azure SQL: no network, no cost, no state carried between runs.
# Flyway's migration is SQL-Server-specific (IDENTITY, DATETIME2, a filtered index), so it doesn't apply here;
# Hibernate builds the schema straight from the entities instead.
# The two are meant to describe the same table, but nothing enforces that beyond it being reviewed by eye.
spring.datasource.url=jdbc:h2:mem:contacts;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

spring.mail.host=localhost
