spring.application.name=krahler-api

# Comma-separated; override with API_ALLOWED_ORIGINS. Local development is allowed by the dev profile in the tests, not here.
api.allowed-origins=https://krahler.com,https://www.krahler.com
api.contact-rate-limit.max-requests=5
api.contact-rate-limit.window=1h
api.version=${API_VERSION:dev}
api.contact-notify-to=${MAIL_TO:eliothkrahler@gmail.com}

# Gmail SMTP. Messages aren't stored anywhere yet (that's the database phase), so this is the only way a contact submission reaches anyone; a send failure is logged but never fails the request (see ContactController).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Azure SQL, serverless with auto-pause. DB_HOST/DB_NAME/DB_USERNAME/DB_PASSWORD come from the Container App secrets the deploy workflow sets from Terraform's output (see api/terraform/database.tf).
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:1433;database=${DB_NAME:krahler};encrypt=true;trustServerCertificate=false;loginTimeout=30
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
# Flyway owns the schema; Hibernate only ever validates it matches what the entities expect.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Only what a health probe needs; nothing else is reachable over HTTP.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Never echo internals to callers.
server.error.include-message=never
server.error.include-stacktrace=never
