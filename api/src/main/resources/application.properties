spring.application.name=krahler-api

# Comma-separated; override with API_ALLOWED_ORIGINS. Local development is allowed by the dev profile in the tests, not here.
api.allowed-origins=https://krahler.com,https://www.krahler.com
api.contact-rate-limit.max-requests=5
api.contact-rate-limit.window=1h
api.version=${API_VERSION:dev}
api.contact-notify-to=${MAIL_TO:eliothkrahler@gmail.com}

# The build-time snapshot (scripts/activity-snapshot.mjs) still covers the first paint and the no-JS fallback; this proxy replaces the browser's own live call to GitHub, which shared the unauthenticated 60/hr limit across every visitor behind the same IP.
# GITHUB_ACTIVITY_TOKEN is a fine-grained PAT with no scopes (public read only), separate from any GITHUB_TOKEN the CI workflows use.
api.activity-github-user=${VITE_GITHUB_USER:EliothK}
api.activity-github-token=${GITHUB_ACTIVITY_TOKEN:}
api.activity-limit=5
api.activity-cache-ttl=10m

# Gmail SMTP. Messages aren't stored anywhere yet (that's the database phase), so this is the only way a contact submission reaches anyone; a send failure is logged but never fails the request (see ContactController).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Azure SQL, serverless with auto-pause. DB_HOST and DB_NAME are set by the deploy workflow (api.yml).
# In Azure, DB_AUTHENTICATION=ActiveDirectoryManagedIdentity (set by api.yml) signs in as the Container App's managed identity, with no username or password; SQL authentication is off on the server.
# The SqlPassword default is only for running against a local SQL Server.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:1433;database=${DB_NAME:krahler};encrypt=true;trustServerCertificate=false;loginTimeout=30;authentication=${DB_AUTHENTICATION:SqlPassword}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
# Nothing may connect to the database at startup: the uptime check cold-starts this app about three times an hour, and a connection on each start kept
# Azure SQL serverless from ever auto-pausing (~$7.50/day). Flyway owns the schema and runs on the first contact submission (LazySchemaMigrator);
# Hibernate neither validates the schema nor reads JDBC metadata at boot, so it needs the dialect named explicitly.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
# The full /actuator/health response would otherwise include a database check, so anyone requesting it would wake the database.
management.health.db.enabled=false

# Only what a health probe needs; nothing else is reachable over HTTP.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Never echo internals to callers.
server.error.include-message=never
server.error.include-stacktrace=never
