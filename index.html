<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The profile photo is rendered by React, so without these the browser only finds it after the JS bundle runs. Keep the URL in sync with PROFILE_PIC in ProfileCard.tsx. -->
    <link rel="preconnect" href="https://avatars.githubusercontent.com" />
    <link
      rel="preload"
      as="image"
      href="https://avatars.githubusercontent.com/u/175250448?v=4&s=320"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elioth Krahler - DevOps, Fullstack and Backend Developer</title>
    <meta
      name="description"
      content="Elioth Krahler — CS graduate in Bismarck, ND building forecasting systems and the delivery pipelines that put them in production. Open to DevOps, fullstack, and backend roles."
    />

    <meta property="og:title" content="Elioth Krahler - DevOps, Fullstack and Backend Developer" />
    <meta
      property="og:description"
      content="Elioth Krahler — CS graduate in Bismarck, ND building forecasting systems and the delivery pipelines that put them in production. Open to DevOps, fullstack, and backend roles."
    />
    <meta property="og:image" content="https://krahler.com/og.png" />
    <meta property="og:url" content="https://krahler.com" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://krahler.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Elioth Krahler",
        "url": "https://krahler.com",
        "jobTitle": "DevOps, fullstack and backend developer",
        "address": { "@type": "PostalAddress", "addressLocality": "Bismarck", "addressRegion": "ND", "addressCountry": "US" },
        "sameAs": ["https://github.com/EliothK"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
