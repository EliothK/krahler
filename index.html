<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The profile photo has no preload on purpose: the prerendered <img> is found by the preload scanner straight away, and a rel="preload" here picked the wrong srcset size on phones and downloaded the photo twice. -->
    <link rel="preconnect" href="https://avatars.githubusercontent.com" />
    <!-- Fonts are only discovered once the CSS has downloaded and parsed; the headline and the paragraph under it wait on these two, so fetch them alongside the CSS instead. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2"
    />
    <meta name="theme-color" content="#0e0f14" />
    <title>Elioth Krahler - DevOps, Fullstack and Backend Developer</title>
    <meta
      name="description"
      content="Elioth Krahler — CS graduate in Bismarck, ND building forecasting systems and the delivery pipelines that put them in production. Open to DevOps, fullstack, and backend roles."
    />

    <meta property="og:title" content="Elioth Krahler - DevOps, Fullstack and Backend Developer" />
    <meta
      property="og:description"
      content="Elioth Krahler — CS graduate in Bismarck, ND building forecasting systems and the delivery pipelines that put them in production. Open to DevOps, fullstack, and backend roles."
    />
    <meta property="og:image" content="https://krahler.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Elioth Krahler: Curious first. Shipped second. Open to DevOps, fullstack and backend roles." />
    <meta property="og:url" content="https://krahler.com" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://krahler.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Elioth Krahler",
        "url": "https://krahler.com",
        "jobTitle": "DevOps, fullstack and backend developer",
        "address": { "@type": "PostalAddress", "addressLocality": "Bismarck", "addressRegion": "ND", "addressCountry": "US" },
        "sameAs": ["https://github.com/EliothK", "https://www.linkedin.com/in/elioth-krahler-a9215843a/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
