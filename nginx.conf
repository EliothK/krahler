server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; object-src 'none'; base-uri 'self'" always;
    }

    # Hashed filenames - safe to cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security.conf;
        access_log off;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Everything else, including index.html. Never cached.
    location / {
        include /etc/nginx/snippets/security.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    error_page 500 502 503 504 /50x.html;
}
