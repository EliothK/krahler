apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: default-deny-ingress
    namespace: portfolio
spec:
    podSelector: {}
    policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: allow-gateway
    namespace: portfolio
spec:
    podSelector:
        matchLabels: { app:portfolio }
    policyTypes: [Ingress]
    ingress:
        - from:
              - namespaceSelector:
                matchLabels: { kubernetes.io/metadata.name: aks_istio_system }
          ports:
              - { protocol: TCP, port: 8080 }
