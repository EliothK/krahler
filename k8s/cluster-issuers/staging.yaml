apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
    name: letsencrypt-staging
spec:
    acme:
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        email: elioth@krahler.com
        privateKeySecretRef:
            name: letsencrypt-staging-account
        solvers:
            - http01:
              gatewayHTTPRoute:
                  parentRefs:
                      - name: portfolio-gateway
                        namespace: portfolio
                        kind: Gateway
